name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: dummy-csms tests
        working-directory: dummy-csms
        run: pip install -r requirements-dev.txt && PYTHONPATH=. pytest -q
      - name: shim tests
        working-directory: everhome-shim
        run: pip install -r requirements-dev.txt && PYTHONPATH=. pytest -q
      - name: ui tests
        working-directory: ui
        run: pip install pytest && PYTHONPATH=. pytest -q
      - name: compose files
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose -f docker-compose.simple.yml config --quiet
